# atlas-secrets - the Secret every Deployment in deployments.yaml loads via
# envFrom, and that the StatefulSets/Deployments in infrastructure.yaml read
# with secretKeyRef (keys postgres-user, postgres-password, mongo-user,
# mongo-password, redis-password, rabbitmq-password).
#
# HOW TO USE - do NOT commit real values here:
#   1. Copy this file and replace every CHANGEME value, or better:
#   2. Create it imperatively and never store it in git:
#        kubectl create secret generic atlas-secrets \
#          --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#          --from-literal=INTERNAL_JWT_SECRET="$(openssl rand -base64 48)" \
#          ... (same key names as below)
#      For production prefer ExternalSecrets or SealedSecrets so the values
#      live in a vault/KMS instead of this repo.
#
# REQUIRED KEYS PER SERVICE (services fail to boot without them):
#   api-gateway:            JWT_SECRET, INTERNAL_JWT_SECRET, AUDIT_INTERNAL_KEY
#   auth-service:           JWT_SECRET, ADMIN_DEFAULT_PASSWORD, POSTGRES_URL,
#                           AUDIT_INTERNAL_KEY, SCIM_API_KEY
#                           (+ INTERNAL_JWT_SECRET once audit moves to JWT auth)
#   employee-python-service (MONGO_URL, RABBITMQ_URL, INTERNAL_JWT_SECRET),
#   analytics-python-service (POSTGRES_URL, POSTGRES_USER, POSTGRES_PASSWORD,
#                           RABBITMQ_PASSWORD), notification-go-service (RABBITMQ_URL,
#                           INTERNAL_JWT_SECRET), attendance-service (POSTGRES_URL,
#                           INTERNAL_JWT_SECRET), lms-service (DB_USER, DB_PASSWORD,
#                           INTERNAL_JWT_SECRET), payroll/leave/performance
#                           (SPRING_DATASOURCE_PASSWORD, SPRING_RABBITMQ_PASSWORD),
#   audit-compliance-service (DATABASE_URL, INTERNAL_API_KEY),
#   integration-service (DATABASE_URL, INTERNAL_API_KEY),
#   security-service (DATABASE_URL, INTERNAL_API_KEY - overridden per
#                           Deployment from SECURITY_INTERNAL_KEY below because it
#                           must differ from the audit key),
#   ats/lifecycle/workforce (DATABASE_URL), ai-copilot (OPENAI_API_KEY),
#   postgres (postgres-user, postgres-password),
#   mongodb (mongo-user, mongo-password), redis (redis-password),
#   rabbitmq (rabbitmq-password).
apiVersion: v1
kind: Secret
metadata:
  name: atlas-secrets
  labels:
    app: atlas-secrets
type: Opaque
stringData:
  # --- platform signing secrets (generate with: openssl rand -base64 48) ---
  JWT_SECRET: "CHANGEME-jwt-secret-min-32-chars"
  INTERNAL_JWT_SECRET: "CHANGEME-internal-jwt-secret-min-32-chars"
  MFA_STEPUP_SECRET: "CHANGEME-mfa-stepup-secret-min-32-chars"
  # --- service credentials ---
  ADMIN_DEFAULT_PASSWORD: "CHANGEME-admin-password"
  SCIM_API_KEY: "CHANGEME-scim-api-key"
  SAML_IDP_CERT: ""
  OAUTH_ENCRYPTION_KEY: "CHANGEME-oauth-encryption-key-min-32-chars"
  AUDIT_INTERNAL_KEY: "CHANGEME-audit-internal-key"
  SECURITY_INTERNAL_KEY: "CHANGEME-security-internal-key-must-differ-from-audit-key"
  SLACK_SIGNING_SECRET: ""
  SLACK_WEBHOOK_SECRET: ""
  OPENAI_API_KEY: ""
  # --- datastores (must match the passwords baked into the connection
  # --- strings below and the infrastructure Deployments).
  # --- User/db names live in configmap.yaml; only secrets here. ---
  POSTGRES_PASSWORD: "CHANGEME-postgres-password"
  MONGO_PASSWORD: "CHANGEME-mongo-password"
  RABBITMQ_PASSWORD: "CHANGEME-rabbit-password"
  REDIS_PASSWORD: "CHANGEME-redis-password"
  DB_PASSWORD: "CHANGEME-postgres-password"
  SPRING_DATASOURCE_PASSWORD: "CHANGEME-postgres-password"
  SPRING_RABBITMQ_PASSWORD: "CHANGEME-rabbit-password"
  # --- connection strings (keep passwords in sync with the entries above) ---
  DATABASE_URL: "postgresql://atlas_user:CHANGEME-postgres-password@postgres:5432/atlas_db"
  POSTGRES_URL: "postgresql://atlas_user:CHANGEME-postgres-password@postgres:5432/atlas_db"
  MONGO_URL: "mongodb://admin:CHANGEME-mongo-password@mongodb:27017/atlas_db?authSource=admin"
  RABBITMQ_URL: "amqp://atlas_rabbit:CHANGEME-rabbit-password@rabbitmq:5672/"
  REDIS_URL: "redis://:CHANGEME-redis-password@redis:6379"
  # --- infrastructure secretKeyRef aliases (kebab-case, see infrastructure.yaml) ---
  postgres-user: "atlas_user"
  postgres-password: "CHANGEME-postgres-password"
  mongo-user: "admin"
  mongo-password: "CHANGEME-mongo-password"
  redis-password: "CHANGEME-redis-password"
  rabbitmq-password: "CHANGEME-rabbit-password"
