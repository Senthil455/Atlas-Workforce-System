name: Enterprise Polyglot CI

permissions:
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  frontend-check:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeCheck
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test
      - name: Security audit
        # Same allowlist gate as node-services-check (GHSA-vfj7-8cjw-p6xm has
        # no patched version; see comment there).
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          python3 -c "
          import json, sys
          allowlist = {'GHSA-vfj7-8cjw-p6xm'}
          allow_urls = {'https://github.com/advisories/' + a for a in allowlist}
          try:
              data = json.load(open('/tmp/npm-audit.json'))
          except Exception as e:
              print(f'FAIL: could not parse npm audit output: {e}')
              sys.exit(1)
          vulns = data.get('vulnerabilities') or {}
          def advisory_urls(name, seen=None):
              # npm links chain entries by package name; resolve transitively
              # to the leaf advisory objects.
              seen = seen or set()
              if name in seen:
                  return set()
              seen.add(name)
              info = vulns.get(name)
              if not info:
                  return set()
              urls = set()
              for v in info.get('via', []) or []:
                  if isinstance(v, dict):
                      if v.get('url'):
                          urls.add(v['url'])
                  elif isinstance(v, str):
                      urls |= advisory_urls(v, seen)
              return urls
          bad = []
          for name, info in vulns.items():
              sev = (info.get('severity') or '').lower()
              if sev not in ('high', 'critical'):
                  continue
              urls = advisory_urls(name)
              if urls and urls <= allow_urls:
                  print(f'allowlisted: {name} ({sorted(urls)})')
                  continue
              bad.append((name, sev))
          if bad:
              print(f'FAIL: npm audit findings above allowlist: {bad}')
              sys.exit(1)
          print('npm audit gate passed')
          "
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api

  node-services-check:
    name: Node Services CI
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-value
      INTERNAL_JWT_SECRET: ci-test-internal-secret-value
      AUDIT_INTERNAL_KEY: ci-test-audit-key
      ADMIN_DEFAULT_PASSWORD: ci-test-admin-password-value
      SCIM_API_KEY: ci-test-scim-key
      POSTGRES_URL: postgresql://test:test@localhost:5432/test
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway-node, auth-service]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: services/${{ matrix.service }}
      - name: Security audit
        # Fail on high/critical findings except explicitly allowlisted
        # advisories. Allowlist (documented accepted risk, no patched version
        # exists): GHSA-vfj7-8cjw-p6xm — braces stack-exhaustion via
        # micromatch (transitive of http-proxy-middleware); patterns matched
        # are static server-side proxy config, not attacker input.
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          python3 -c "
          import json, sys
          allowlist = {'GHSA-vfj7-8cjw-p6xm'}
          allow_urls = {'https://github.com/advisories/' + a for a in allowlist}
          try:
              data = json.load(open('/tmp/npm-audit.json'))
          except Exception as e:
              print(f'FAIL: could not parse npm audit output: {e}')
              sys.exit(1)
          vulns = data.get('vulnerabilities') or {}
          def advisory_urls(name, seen=None):
              # npm links chain entries by package name; resolve transitively
              # to the leaf advisory objects.
              seen = seen or set()
              if name in seen:
                  return set()
              seen.add(name)
              info = vulns.get(name)
              if not info:
                  return set()
              urls = set()
              for v in info.get('via', []) or []:
                  if isinstance(v, dict):
                      if v.get('url'):
                          urls.add(v['url'])
                  elif isinstance(v, str):
                      urls |= advisory_urls(v, seen)
              return urls
          bad = []
          for name, info in vulns.items():
              sev = (info.get('severity') or '').lower()
              if sev not in ('high', 'critical'):
                  continue
              urls = advisory_urls(name)
              if urls and urls <= allow_urls:
                  print(f'allowlisted: {name} ({sorted(urls)})')
                  continue
              bad.append((name, sev))
          if bad:
              print(f'FAIL: npm audit findings above allowlist: {bad}')
              sys.exit(1)
          print('npm audit gate passed')
          "
        working-directory: services/${{ matrix.service }}
      - name: Syntax check
        run: node -c index.js
        working-directory: services/${{ matrix.service }}
      - name: Start gateway for integration test
        if: matrix.service == 'api-gateway-node'
        run: node index.js > /tmp/gateway.log 2>&1 & echo $! > /tmp/gateway.pid
        working-directory: services/${{ matrix.service }}
      - name: Wait for gateway
        if: matrix.service == 'api-gateway-node'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo "Gateway is up"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/health
      - name: Run unit tests
        run: npm test
        working-directory: services/${{ matrix.service }}

  go-services-check:
    name: Go Services CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [notification-go-service, attendance-service, lms-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          # lms-service and notification-go-service declare go >= 1.25/1.26;
          # an older toolchain refuses to build them before gosec runs.
          go-version: "1.26"
      - name: Install dependencies
        run: go mod download
        working-directory: services/${{ matrix.service }}
      - name: Tidy dependencies
        run: go mod tidy
        working-directory: services/${{ matrix.service }}
      - name: Vet
        run: go vet ./...
        working-directory: services/${{ matrix.service }}
      - name: Compile check
        run: go build -v ./...
        working-directory: services/${{ matrix.service }}
      - name: Run unit tests
        run: go test -v -count=1 ./...
        working-directory: services/${{ matrix.service }}
      - name: Security scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./...
        working-directory: services/${{ matrix.service }}
      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/${{ matrix.service }}/gosec-results.sarif
          category: gosec-${{ matrix.service }}
        if: always() && hashFiles('services/**/gosec-results.sarif') != ''

  python-services-check:
    name: Python Services CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: atlas_password
          POSTGRES_DB: atlas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_user -d atlas_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        service: [employee-python-service, analytics-python-service, integration-service, ai-service, security-service, live-service, employee-lifecycle-service, workforce-planning-service, ats-service, audit-compliance-service, ai-copilot-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: services/${{ matrix.service }}
      - name: Install linting tools
        run: pip install flake8 pytest pytest-asyncio httpx httpx2 bandit sarif-om jschema-to-python
        working-directory: services/${{ matrix.service }}
      - name: Syntax check
        run: python -m py_compile main.py
        working-directory: services/${{ matrix.service }}
      - name: Lint Python
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120
        working-directory: services/${{ matrix.service }}
      - name: Security scan
        run: bandit -r . -f sarif -o bandit-results.sarif --severity-level high
        working-directory: services/${{ matrix.service }}
      - name: Upload bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/${{ matrix.service }}/bandit-results.sarif
          category: bandit-${{ matrix.service }}
        if: always() && hashFiles('services/**/bandit-results.sarif') != ''
      - name: Set test environment variables
        run: |
          echo "RABBITMQ_USER=guest" >> $GITHUB_ENV
          echo "RABBITMQ_PASSWORD=guest" >> $GITHUB_ENV
          if [[ "${{ matrix.service }}" == "employee-python-service" ]]; then
            echo "MONGO_USER=test" >> $GITHUB_ENV
            echo "MONGO_PASSWORD=test" >> $GITHUB_ENV
            echo "INTERNAL_KEY=test-internal-key" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "analytics-python-service" ]]; then
            echo "POSTGRES_USER=atlas_user" >> $GITHUB_ENV
            echo "POSTGRES_PASSWORD=atlas_password" >> $GITHUB_ENV
            echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "integration-service" ]]; then
            echo "INTERNAL_API_KEY=test-key" >> $GITHUB_ENV
            echo "DATABASE_URL=postgresql://atlas_user:atlas_password@localhost:5432/atlas_db" >> $GITHUB_ENV
            echo "WEBHOOK_ALLOW_HTTP=true" >> $GITHUB_ENV
            echo "WEBHOOK_ALLOW_PRIVATE_IPS=true" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "security-service" ]]; then
            echo "DATABASE_URL=postgresql://atlas_user:atlas_password@localhost:5432/atlas_db" >> $GITHUB_ENV
            echo "INTERNAL_API_KEY=test-key" >> $GITHUB_ENV
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "live-service" ]]; then
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "employee-lifecycle-service" ]]; then
            echo "DATABASE_URL=postgresql://atlas_user:atlas_password@localhost:5432/atlas_db" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "workforce-planning-service" ]]; then
            echo "DATABASE_URL=postgresql://atlas_user:atlas_password@localhost:5432/atlas_db" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "ats-service" ]]; then
            # ATS uses PostgreSQL-only columns (UUID/ARRAY): run it against
            # the job's postgres service instead of sqlite. The service
            # defaults (atlas_user/atlas_password@localhost/atlas_db) match
            # the container above, so no DATABASE_URL override is needed.
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "audit-compliance-service" ]]; then
            echo "DATABASE_URL=postgresql://atlas_user:atlas_password@localhost:5432/atlas_db" >> $GITHUB_ENV
            echo "TEST_DATABASE_URL=postgresql://atlas_user:atlas_password@localhost:5432/atlas_db" >> $GITHUB_ENV
            echo "INTERNAL_API_KEY=test-key" >> $GITHUB_ENV
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "ai-copilot-service" ]]; then
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "ai-service" ]]; then
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          fi
      - name: Test Python
        if: hashFiles(format('services/{0}/test_*.py', matrix.service)) != '' || hashFiles(format('services/{0}/tests/**', matrix.service)) != ''
        run: pytest -v
        working-directory: services/${{ matrix.service }}

  java-services-check:
    name: Java Services CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [payroll-java-service, leave-service, performance-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Install atlas-common dependency
        run: mvn install -DskipTests
        working-directory: services/atlas-common
      - name: Set test environment variables
        run: |
          echo "SPRING_DATASOURCE_PASSWORD=test" >> $GITHUB_ENV
          echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
      - name: Compile and test
        run: mvn clean test
        working-directory: services/${{ matrix.service }}

  docker-user-check:
    name: Docker Non-Root User Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every image declares a non-root USER
        run: bash scripts/check-docker-nonroot.sh

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - frontend
          - api-gateway-node
          - auth-service
          - notification-go-service
          - attendance-service
          - lms-service
          - employee-python-service
          - analytics-python-service
          - ats-service
          - audit-compliance-service
          - ai-copilot-service
          - ai-service
          - integration-service
          - security-service
          - live-service
          - employee-lifecycle-service
          - workforce-planning-service
          - payroll-java-service
          - leave-service
          - performance-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'push'
      - name: Determine Docker context
        id: context
        shell: bash
        run: |
          if [[ "${{ matrix.image }}" == "frontend" ]]; then
            echo "context=frontend" >> $GITHUB_OUTPUT
            echo "file=frontend/Dockerfile" >> $GITHUB_OUTPUT
          elif [[ -f "services/${{ matrix.image }}/requirements.txt" ]]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "file=services/${{ matrix.image }}/Dockerfile" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.image }}" == "payroll-java-service" ]] || [[ "${{ matrix.image }}" == "leave-service" ]] || [[ "${{ matrix.image }}" == "performance-service" ]]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "file=services/${{ matrix.image }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=services/${{ matrix.image }}" >> $GITHUB_OUTPUT
            echo "file=services/${{ matrix.image }}/Dockerfile" >> $GITHUB_OUTPUT
          fi
      - name: Lowercase repository name for Docker tags
        id: repo_lower
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.context.outputs.context }}
          file: ${{ steps.context.outputs.file }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_lower.outputs.name }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.repo_lower.outputs.name }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-safety-check:
    name: Compose Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compose does not default to insecure secrets with NODE_ENV=development
        run: |
          python3 -c "
          import pathlib, sys
          text = pathlib.Path('docker-compose.yml').read_text()
          if 'NODE_ENV:-development' in text:
              print('FAIL: docker-compose.yml still defaults NODE_ENV to development')
              print('The default must be production so secret guards are active on vanilla docker compose up')
              sys.exit(1)
          # Ensure service guards are unconditional (no NODE_ENV gate before default secret check)
          for svc_path in ['services/api-gateway-node/index.js', 'services/auth-service/index.js']:
              content = pathlib.Path(svc_path).read_text()
              if \"NODE_ENV !== 'development'\" in content and 'change-me' in content.lower():
                  print(f'FAIL: {svc_path} still gates default-secret refusal on NODE_ENV')
                  sys.exit(1)
          print('Static checks passed: compose defaults to production and guards are unconditional')
          "
          echo "Rendering docker compose config..."
          if ! docker compose config > /tmp/rendered-compose.yml 2>&1; then
            echo "docker compose config failed, showing output:"
            cat /tmp/rendered-compose.yml
            exit 1
          fi
          if grep -q 'change-me' /tmp/rendered-compose.yml && grep -q 'NODE_ENV.*development' /tmp/rendered-compose.yml; then
            echo "FAIL: rendered docker-compose still emits default secrets together with NODE_ENV=development"
            grep -n 'change-me\|NODE_ENV' /tmp/rendered-compose.yml
            exit 1
          fi
          echo "Rendered compose check passed: no default secrets with development mode"

  k8s-validate:
    name: K8s Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate k8s manifests
        run: python3 scripts/validate-k8s-manifests.py

  ci-coverage-check:
    name: CI Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every service is covered by CI
        shell: bash
        run: |
          python3 << 'PY'
          import pathlib, sys, yaml

          ci_path = pathlib.Path(".github/workflows/ci.yml")
          text = ci_path.read_text()
          data = yaml.safe_load(text)

          def get_matrix(job, key):
              try:
                  return set(data["jobs"][job]["strategy"]["matrix"][key] or [])
              except Exception:
                  return set()

          errors = []

          services_dir = pathlib.Path("services")
          # All services with a Dockerfile must be in docker-build
          docker_expected = {p.name for p in services_dir.iterdir() if p.is_dir() and (p / "Dockerfile").exists()}
          docker_expected.add("frontend")
          docker_matrix = get_matrix("docker-build", "image")
          missing_docker = docker_expected - docker_matrix
          if missing_docker:
              errors.append(f"docker-build missing: {sorted(missing_docker)}")

          # Every prometheus scrape target must be a service in docker-compose.yml,
          # otherwise the target stays down and the ServiceDown alert fires (issue #162).
          # Skip http(s):// probe URLs (blackbox-exporter targets are URLs, not
          # hostnames) and infra-only jobs that intentionally live in
          # docker-compose.monitoring.yml (node-exporter, blackbox-exporter).
          compose = yaml.safe_load(pathlib.Path("docker-compose.yml").read_text())
          compose_services = set(compose.get("services", {}) or {})
          prom = yaml.safe_load(pathlib.Path("prometheus.yml").read_text())
          infra_jobs = {"node-exporter", "blackbox-exporter", "prometheus"}
          prom_targets = set()
          for scrape in prom.get("scrape_configs", []) or []:
              if scrape.get("job_name") in infra_jobs:
                  continue
              for static in scrape.get("static_configs", []) or []:
                  for target in static.get("targets", []) or []:
                      if target.startswith("http://") or target.startswith("https://"):
                          continue
                      host = target.split(":")[0]
                      if host != "localhost":
                          prom_targets.add(host)
          missing_compose = prom_targets - compose_services
          if missing_compose:
              errors.append(f"prometheus targets missing from docker-compose.yml: {sorted(missing_compose)}")

          # Go services: every dir with go.mod must be in go-services-check
          go_expected = {p.name for p in services_dir.iterdir() if (p / "go.mod").exists()}
          go_matrix = get_matrix("go-services-check", "service")
          missing_go = go_expected - go_matrix
          if missing_go:
              errors.append(f"go-services-check missing: {sorted(missing_go)}")

          # Python services with tests: every dir with test_*.py must be in python-services-check
          py_expected = set()
          for p in services_dir.iterdir():
              if p.is_dir():
                  if list(p.glob("test_*.py")) or list(p.glob("tests/test_*.py")) or list(p.rglob("test_*.py")):
                      py_expected.add(p.name)
                  # also check nested tests folder
                  if (p / "tests").exists():
                      py_expected.add(p.name)
          # Filter to only python-like services (has requirements.txt or main.py) to avoid false positives
          py_expected = {s for s in py_expected if (services_dir / s / "requirements.txt").exists() or (services_dir / s / "main.py").exists()}
          py_matrix = get_matrix("python-services-check", "service")
          missing_py = py_expected - py_matrix
          if missing_py:
              errors.append(f"python-services-check missing: {sorted(missing_py)}")

          # Java services: every dir with pom.xml (except atlas-common library) must be in java-services-check
          java_expected = {p.name for p in services_dir.iterdir() if (p / "pom.xml").exists()}
          java_expected.discard("atlas-common")
          java_matrix = get_matrix("java-services-check", "service")
          missing_java = java_expected - java_matrix
          if missing_java:
              errors.append(f"java-services-check missing: {sorted(missing_java)}")

          # Node services: every dir with package.json under services/ (except atlas_observability) should be in node-services-check or frontend-check
          node_expected = {p.name for p in services_dir.iterdir() if (p / "package.json").exists()}
          node_expected.discard("atlas_observability")
          node_matrix = get_matrix("node-services-check", "service")
          # frontend is separate job
          missing_node = node_expected - node_matrix
          if missing_node:
              # auth-service and api-gateway-node are the only node services; if missing, report
              errors.append(f"node-services-check missing: {sorted(missing_node)}")

          if errors:
              print("CI coverage check failed:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          else:
              print("CI coverage check passed: all services are covered")
              print(f"  docker: {sorted(docker_matrix)}")
              print(f"  go: {sorted(go_matrix)}")
              print(f"  python: {sorted(py_matrix)}")
              print(f"  java: {sorted(java_matrix)}")
              print(f"  node: {sorted(node_matrix)}")
          PY

  guard-against-binaries:
    name: Guard Against Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for tracked binaries and logs
        run: |
          echo "Checking for tracked .exe, .log, tsbuildinfo files..."
          if git ls-files | grep -E '\.exe$|\.log$|tsbuildinfo'; then
            echo "ERROR: Tracked binaries/logs found. Run: git rm --cached <file> and ensure .gitignore covers it."
            exit 1
          fi
          echo "Checking for large files >1MB..."
          # Find files >1MB not in .git or node_modules
          large=$(find . -type f -not -path "./.git/*" -not -path "*/node_modules/*" -not -path "./.next/*" -size +1M 2>/dev/null | head -n 20)
          if [ -n "$large" ]; then
            echo "ERROR: Large files found (>1MB):"
            echo "$large"
            echo "Please remove them and add to .gitignore"
            exit 1
          fi
          echo "No tracked binaries/logs or large files found."

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Ephemeral integration credentials: strong, clearly test-scoped values
    # (never real secrets). ADMIN_DEFAULT_PASSWORD seeds admin@atlas.io on
    # first boot and doubles as the Playwright login password.
    env:
      POSTGRES_USER: ci_atlas
      POSTGRES_PASSWORD: Atlas-Ci-Db-Pass-1
      POSTGRES_DB: atlas_db
      RABBITMQ_USER: ci_rabbit
      RABBITMQ_PASS: Atlas-Ci-Rabbit-Pass-1
      MONGO_USER: ci_mongo
      MONGO_PASSWORD: Atlas-Ci-Mongo-Pass-1
      REDIS_PASSWORD: Atlas-Ci-Redis-Pass-1
      JWT_SECRET: ci-test-jwt-secret-atlas-workforce-0123456789abcdef
      INTERNAL_JWT_SECRET: ci-test-internal-secret-atlas-workforce-0123456789abcdef
      MFA_STEPUP_SECRET: ci-test-mfa-stepup-atlas-workforce-0123456789abcdef
      ADMIN_DEFAULT_PASSWORD: Atlas-E2E-Test-Pass-1
      SCIM_API_KEY: ci-test-scim-key
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start backend stack
        # Playwright serves the frontend itself (webServer), so the compose
        # frontend is stopped right after boot to free host port 3000.
        run: docker compose up -d --build && docker compose stop frontend
        working-directory: ${{ github.workspace }}
      - name: Wait for backend health
        run: bash scripts/wait-for-health.sh http://localhost:8080 http://localhost:8010 http://localhost:8012 http://localhost:8011 http://localhost:8013
        working-directory: ${{ github.workspace }}
        env:
          HEALTH_TIMEOUT: 420
      - name: Verify seeded admin login
        # Bounded retries stay under the /api/auth/login rate limit.
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"admin@atlas.io","password":"Atlas-E2E-Test-Pass-1"}' || echo "000")
            if [ "$code" = "200" ]; then
              echo "Seeded admin login works."
              exit 0
            fi
            echo "login attempt $i -> $code, retrying..."
            sleep 10
          done
          echo "FAIL: seeded admin login never returned 200"
          exit 1
        working-directory: ${{ github.workspace }}
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          E2E_USER: admin@atlas.io
          E2E_PASS: Atlas-E2E-Test-Pass-1
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stop backend stack
        if: always()
        run: docker compose down -v
        working-directory: ${{ github.workspace }}
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

