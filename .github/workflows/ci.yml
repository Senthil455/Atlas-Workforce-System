  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Warm Maven cache for Trivy
        # Trivy resolves pom.xml dependencies over the network and fails hard
        # on Maven Central 429s. Pre-populating ~/.m2 (shared via the cache
        # above) keeps the scan deterministic; retry a few times because the
        # throttle is transient per-IP burst limiting.
        run: |
          for svc in atlas-common payroll-java-service leave-service performance-service; do
            for attempt in 1 2 3; do
              if mvn -q -DskipTests -f services/$svc/pom.xml dependency:resolve; then
                break
              fi
              echo "Warmup attempt $attempt failed for $svc, retrying in 90s..."
              sleep 90
            done
          done
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
        if: always() && hashFiles('trivy-results.sarif') != ''
