name: Enterprise Polyglot CI

permissions:
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  frontend-check:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeCheck
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm test
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api

  node-services-check:
    name: Node Services CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway-node, auth-service]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: services/${{ matrix.service }}
      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: services/${{ matrix.service }}
      - name: Syntax check
        run: node -c index.js
        working-directory: services/${{ matrix.service }}
      - name: Run unit tests
        run: npm test
        working-directory: services/${{ matrix.service }}

  go-services-check:
    name: Go Services CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [notification-go-service, attendance-service, lms-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
      - name: Install dependencies
        run: go mod download
        working-directory: services/${{ matrix.service }}
      - name: Tidy dependencies
        run: go mod tidy
        working-directory: services/${{ matrix.service }}
      - name: Vet
        run: go vet ./...
        working-directory: services/${{ matrix.service }}
      - name: Compile check
        run: go build -v ./...
        working-directory: services/${{ matrix.service }}
      - name: Run unit tests
        run: go test -v -count=1 ./...
        working-directory: services/${{ matrix.service }}
      - name: Security scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./...
        working-directory: services/${{ matrix.service }}
      - name: Upload gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/${{ matrix.service }}/gosec-results.sarif
        if: always() && hashFiles('services/**/gosec-results.sarif') != ''

  python-services-check:
    name: Python Services CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [employee-python-service, analytics-python-service, integration-service, ai-service, security-service, live-service, employee-lifecycle-service, workforce-planning-service, ats-service, audit-compliance-service, ai-copilot-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: services/${{ matrix.service }}
      - name: Install linting tools
        run: pip install flake8 pytest pytest-asyncio httpx bandit sarif-om jschema-to-python
        working-directory: services/${{ matrix.service }}
      - name: Syntax check
        run: python -m py_compile main.py
        working-directory: services/${{ matrix.service }}
      - name: Lint Python
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=120
        working-directory: services/${{ matrix.service }}
      - name: Security scan
        run: bandit -r . -f sarif -o bandit-results.sarif --severity-level high
        working-directory: services/${{ matrix.service }}
      - name: Upload bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/${{ matrix.service }}/bandit-results.sarif
        if: always() && hashFiles('services/**/bandit-results.sarif') != ''
      - name: Set test environment variables
        run: |
          echo "RABBITMQ_USER=guest" >> $GITHUB_ENV
          echo "RABBITMQ_PASSWORD=guest" >> $GITHUB_ENV
          if [[ "${{ matrix.service }}" == "employee-python-service" ]]; then
            echo "MONGO_USER=test" >> $GITHUB_ENV
            echo "MONGO_PASSWORD=test" >> $GITHUB_ENV
            echo "INTERNAL_KEY=test-internal-key" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "analytics-python-service" ]]; then
            echo "POSTGRES_USER=test" >> $GITHUB_ENV
            echo "POSTGRES_PASSWORD=test" >> $GITHUB_ENV
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "integration-service" ]]; then
            echo "INTERNAL_API_KEY=test-key" >> $GITHUB_ENV
            echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "security-service" ]]; then
            echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
            echo "INTERNAL_API_KEY=test-key" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "live-service" ]]; then
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "employee-lifecycle-service" ]]; then
            echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "workforce-planning-service" ]]; then
            echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "ats-service" ]]; then
            echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "audit-compliance-service" ]]; then
            echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
            echo "INTERNAL_API_KEY=test-key" >> $GITHUB_ENV
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "ai-copilot-service" ]]; then
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          elif [[ "${{ matrix.service }}" == "ai-service" ]]; then
            echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
          fi
      - name: Test Python
        if: hashFiles(format('services/{0}/test_*.py', matrix.service)) != '' || hashFiles(format('services/{0}/tests/**', matrix.service)) != ''
        run: pytest -v
        working-directory: services/${{ matrix.service }}
        continue-on-error: true

  java-services-check:
    name: Java Services CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payroll-java-service, leave-service, performance-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - name: Install atlas-common dependency
        run: mvn install -DskipTests
        working-directory: services/atlas-common
      - name: Set test environment variables
        run: |
          echo "SPRING_DATASOURCE_PASSWORD=test" >> $GITHUB_ENV
          echo "INTERNAL_JWT_SECRET=test-secret" >> $GITHUB_ENV
      - name: Compile and test
        run: mvn clean test
        working-directory: services/${{ matrix.service }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - frontend
          - api-gateway-node
          - auth-service
          - notification-go-service
          - attendance-service
          - lms-service
          - employee-python-service
          - analytics-python-service
          - ats-service
          - audit-compliance-service
          - ai-copilot-service
          - ai-service
          - integration-service
          - security-service
          - live-service
          - employee-lifecycle-service
          - workforce-planning-service
          - payroll-java-service
          - leave-service
          - performance-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'push'
      - name: Determine Docker context
        id: context
        shell: bash
        run: |
          if [[ "${{ matrix.image }}" == "frontend" ]]; then
            echo "context=frontend" >> $GITHUB_OUTPUT
            echo "file=frontend/Dockerfile" >> $GITHUB_OUTPUT
          elif [[ -f "services/${{ matrix.image }}/requirements.txt" ]]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "file=services/${{ matrix.image }}/Dockerfile" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.image }}" == "payroll-java-service" ]] || [[ "${{ matrix.image }}" == "leave-service" ]] || [[ "${{ matrix.image }}" == "performance-service" ]]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "file=services/${{ matrix.image }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=services/${{ matrix.image }}" >> $GITHUB_OUTPUT
            echo "file=services/${{ matrix.image }}/Dockerfile" >> $GITHUB_OUTPUT
          fi
      - name: Lowercase repository name for Docker tags
        id: repo_lower
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.context.outputs.context }}
          file: ${{ steps.context.outputs.file }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_lower.outputs.name }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.repo_lower.outputs.name }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-coverage-check:
    name: CI Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every service is covered by CI
        shell: bash
        run: |
          python3 << 'PY'
          import pathlib, sys, yaml

          ci_path = pathlib.Path(".github/workflows/ci.yml")
          text = ci_path.read_text()
          data = yaml.safe_load(text)

          def get_matrix(job, key):
              try:
                  return set(data["jobs"][job]["strategy"]["matrix"][key] or [])
              except Exception:
                  return set()

          errors = []

          services_dir = pathlib.Path("services")
          # All services with a Dockerfile must be in docker-build
          docker_expected = {p.name for p in services_dir.iterdir() if p.is_dir() and (p / "Dockerfile").exists()}
          docker_expected.add("frontend")
          docker_matrix = get_matrix("docker-build", "image")
          missing_docker = docker_expected - docker_matrix
          if missing_docker:
              errors.append(f"docker-build missing: {sorted(missing_docker)}")

          # Go services: every dir with go.mod must be in go-services-check
          go_expected = {p.name for p in services_dir.iterdir() if (p / "go.mod").exists()}
          go_matrix = get_matrix("go-services-check", "service")
          missing_go = go_expected - go_matrix
          if missing_go:
              errors.append(f"go-services-check missing: {sorted(missing_go)}")

          # Python services with tests: every dir with test_*.py must be in python-services-check
          py_expected = set()
          for p in services_dir.iterdir():
              if p.is_dir():
                  if list(p.glob("test_*.py")) or list(p.glob("tests/test_*.py")) or list(p.rglob("test_*.py")):
                      py_expected.add(p.name)
                  # also check nested tests folder
                  if (p / "tests").exists():
                      py_expected.add(p.name)
          # Filter to only python-like services (has requirements.txt or main.py) to avoid false positives
          py_expected = {s for s in py_expected if (services_dir / s / "requirements.txt").exists() or (services_dir / s / "main.py").exists()}
          py_matrix = get_matrix("python-services-check", "service")
          missing_py = py_expected - py_matrix
          if missing_py:
              errors.append(f"python-services-check missing: {sorted(missing_py)}")

          # Java services: every dir with pom.xml (except atlas-common library) must be in java-services-check
          java_expected = {p.name for p in services_dir.iterdir() if (p / "pom.xml").exists()}
          java_expected.discard("atlas-common")
          java_matrix = get_matrix("java-services-check", "service")
          missing_java = java_expected - java_matrix
          if missing_java:
              errors.append(f"java-services-check missing: {sorted(missing_java)}")

          # Node services: every dir with package.json under services/ (except atlas_observability) should be in node-services-check or frontend-check
          node_expected = {p.name for p in services_dir.iterdir() if (p / "package.json").exists()}
          node_expected.discard("atlas_observability")
          node_matrix = get_matrix("node-services-check", "service")
          # frontend is separate job
          missing_node = node_expected - node_matrix
          if missing_node:
              # auth-service and api-gateway-node are the only node services; if missing, report
              errors.append(f"node-services-check missing: {sorted(missing_node)}")

          if errors:
              print("CI coverage check failed:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          else:
              print("CI coverage check passed: all services are covered")
              print(f"  docker: {sorted(docker_matrix)}")
              print(f"  go: {sorted(go_matrix)}")
              print(f"  python: {sorted(py_matrix)}")
              print(f"  java: {sorted(java_matrix)}")
              print(f"  node: {sorted(node_matrix)}")
          PY

  guard-against-binaries:
    name: Guard Against Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for tracked binaries and logs
        run: |
          echo "Checking for tracked .exe, .log, tsbuildinfo files..."
          if git ls-files | grep -E '\.exe$|\.log$|tsbuildinfo'; then
            echo "ERROR: Tracked binaries/logs found. Run: git rm --cached <file> and ensure .gitignore covers it."
            exit 1
          fi
          echo "Checking for large files >1MB..."
          # Find files >1MB not in .git or node_modules
          large=$(find . -type f -not -path "./.git/*" -not -path "*/node_modules/*" -not -path "./.next/*" -size +1M 2>/dev/null | head -n 20)
          if [ -n "$large" ]; then
            echo "ERROR: Large files found (>1MB):"
            echo "$large"
            echo "Please remove them and add to .gitignore"
            exit 1
          fi
          echo "No tracked binaries/logs or large files found."

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api
      # For a full stack run, uncomment the docker compose step below and let webServer reuse the existing server:
      # - name: Start full stack
      #   run: docker compose up -d --build && ./scripts/wait-for-health.sh
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          E2E_USER: admin@atlas.io
          E2E_PASS: ChangeMe123!
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  k6-performance:
    name: K6 Performance (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        run: |
          curl -s https://packagecloud.io/install/repositories/grafana/k6/script.deb.sh | sudo bash
          sudo apt-get install -y k6
      - name: Run k6 smoke test
        run: k6 run tests/performance/k6-smoke.js
        env:
          BASE_URL: http://localhost:8080
          AUTH_URL: http://localhost:8010
          EMPLOYEE_URL: http://localhost:8001
          PAYROLL_URL: http://localhost:8002
          ANALYTICS_URL: http://localhost:8003
          ATTENDANCE_URL: http://localhost:8005
          LEAVE_URL: http://localhost:8006
          ATS_URL: http://localhost:8012
          LMS_URL: http://localhost:8013
          COPILOT_URL: http://localhost:8015
          AUDIT_URL: http://localhost:8011

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always() && hashFiles('trivy-results.sarif') != ''
